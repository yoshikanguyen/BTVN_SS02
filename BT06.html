    <section>
        <body>

            <!-- Thông tin sản phẩm -->          
            <section>
                <h2>Thông tin sản phẩm</h2>
                <table border="2.5">
                    <tr>
                        <th>Tên sản phẩm</th>
                        <th>Mô tả</th>
                        <th>Giá</th>
                        <th>Số lượng</th>
                    </tr>
                    <tr>
                        <td>Sản phẩm 1</td>
                        <td>Mô tả sản phẩm 1</td>
                        <td>100.000</td>
                        <td>10</td>
                    </tr>
                    <tr>
                        <td>Sản phẩm 2</td>
                        <td>Mô tả sản phẩm 2</td>
                        <td>200.000</td>
                        <td>5</td>
                    </tr>
                    <tr>
                        <td>Sản phẩm 3</td>
                        <td>Mô tả sản phẩm 3</td>
                        <td>300.000</td>
                        <td>3</td>
                    </tr>
                </table>
        </section>

        <!-- Thông tin người dùng -->
        <section>
            <h2>Thông tin người dùng</h2>
            
            <form action="http://www.myserver.com" method="post">
                
                <label for="user">Họ và tên:</label>
                <input type="text" name="user"><br/>
                
                <label for="email">Email:</label>
                <input type="email" name="email"><br/>
                
                <label for="sdt">Số điện thoại:</label>
                <input 
                type="tel" 
                name="sdt" 
                pattern="[0-9]{4}.[0-9]{3}.[0-9]{3}"
                placeholder="0123.456.789"><br/>
                
                <label for="đ/c">Địa chỉ:</label>
                <input type="text" name="đ/c"><br/>
                
                <button>Đặt hàng</button>
            </form>
            
        </section>

        </body>
        
    </section>
