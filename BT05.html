    <!-- BT05_02 -->
    <section>
        <h1>Booking Form</h1>

        <form action="http://myserver.com" method="post">
            <p><label for="name">Name:</label>
            <input type="text" name="name"/><br/></p>
            
            <p><label for="email">Email:</label>
            <input type="email" name="email"/><br/></p>
            
            <p><label for="phone">Phone:</label>
            <input type="tel" name="phone"
            pattern="[0-9]{4}-[0-9]{3}-[0-9]{3}"
            placeholder="0123-456-789"/>
            <br/></p>

            <p><label for="date">Date:</label>
            <input type="date" name="date"/><br/></p>
            
            <p><label for="time">Time:</label>
            <input type="time" name="Time"/><br/></p>

            <p><label for="NoG">Number of Guests:</label>
            <input type="number" name="NoG" step="1" min="1"/><br/></p>

            <input type="submit">
        </form>
    </section>

    <!-- BT05_03 -->
    <section>
        
        <h1>Car Purchase Form</h1>

        <form action="http://myserver.com" method="post">
            <p><label for="name">Name:</label>
            <input type="text" name="name"/><br/></p>
            
            <p><label for="email">Email:</label>
            <input type="email" name="email"/><br/></p>
            
            <p><label for="phone">Phone:</label>
            <input 
            type="tel" 
            name="phone" 
            pattern="[0-9]{4}.[0-9]{3}.[0-9]{3}"
            placeholder="0123.456.879"
            /><br/></p>
            
            <p><label for="car">Choose a Car:</label>
            <select name="car">
                <option value="Model 1" selected>Model 1</option>
                <option value="Model 2">Model 2</option>
                <option value="Model 3">Model 3</option>
                <option value="Model 4">Model 4</option>
                <option value="Model 5">Model 5</option>
            </select><br/></p>

            <p><label for="car">Choose a Color:</label>
            <select name="color">
                <option value="Red" selecteds>Red</option>
                <option value="Blue">Blue</option>
                <option value="Grey">Grey</option>
                <option value="Black">Black</option>
                <option value="White">White</option>
            </select><br/></p>

            <p><label for="quantity">Quantity:</label>
            <input type="number" name="quantity" step="1" min="1"/><br/></p>

            <p><label for="date">Delivery Date:</label>
            <input type="date" name="date"/><br/></p>

            <input type="submit">
        </form>
    </section>
</body>
